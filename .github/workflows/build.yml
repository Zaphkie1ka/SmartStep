name: Build SmartStep

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SmartStep/SmartStep.csproj

      - name: Build
        run: dotnet build SmartStep/SmartStep.csproj -c Release --no-restore

      - name: Publish single-file exe (win-x64, self-contained)
        run: >
          dotnet publish SmartStep/SmartStep.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o publish

      - name: Add config template
        shell: pwsh
        run: Copy-Item SmartStep/appsettings.example.json publish/appsettings.example.json

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SmartStep-win-x64
          path: publish/
          if-no-files-found: error
